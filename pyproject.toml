[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techdetect"
version = "0.1.0"
description = "Detect the technologies used by websites, with evidence for every detection."
readme = "README.md"
requires-python = ">=3.11"
# Lower bounds only: no exact pins yet, so the same file works on 3.11 and 3.13.
dependencies = [
    "httpx[http2]>=0.27",
    "playwright>=1.44",
    "dnspython>=2.6",
    "pyarrow>=16",
    "typer>=0.12",
    "rich>=13",
    "tldextract>=5",
    "regex>=2024.4",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
techdetect = "techdetect.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes basics; I: import order; UP: modern syntax; B: likely bugs.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
