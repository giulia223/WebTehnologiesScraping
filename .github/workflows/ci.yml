name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 = the minimum we support; 3.13 = the version used for development.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Installing the playwright package does not download browsers; tests never launch one.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
